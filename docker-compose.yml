services:
  nginx:
    container_name: "form-craft-nginx"
    image: nginx:1.21.1
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/
    depends_on:
      - php

  php:
    container_name: "form-craft-php"
    build: ./docker/php
    volumes:
      - ./src:/var/www/

  mysql:
    image: mysql:8.0.26
    container_name: "form-craft-db"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: form_craft_db
      MYSQL_USER: form_craft_user
      MYSQL_PASSWORD: form_craft_pass
    command:
      mysqld --default-authentication-plugin=mysql_native_password
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: "form-craft-phpmyadmin"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=form-craft-db
      - PMA_USER=root
      - PMA_PASSWORD=password
    ports:
      - "8080:80"
    depends_on:
      - mysql

  mailhog:
    image: mailhog/mailhog
    container_name: "form-craft-mailhog"
    ports:
      - "8025:8025"
      - "1025:1025"
